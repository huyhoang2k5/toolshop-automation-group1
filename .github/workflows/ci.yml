name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.browser }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    env:
      BASE_URL: http://localhost:4200
      API_URL: http://localhost:8091
      GITHUB_API_URL: https://api.github.com
      ROUTE_PREFIX: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Start local Toolshop
        run: bash toolshop/start.sh

      - name: Run all tests
        run: |
          python -m pytest tests/ -v \
            --browser ${{ matrix.browser }} \
            --tracing retain-on-failure \
            --output test-results \
            --html=report.html --self-contained-html

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-${{ matrix.browser }}
          path: report.html
          if-no-files-found: warn

      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traces-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: warn

      - name: Show Toolshop logs on failure
        if: failure()
        run: docker compose -f toolshop/docker-compose.yml logs --tail=100
